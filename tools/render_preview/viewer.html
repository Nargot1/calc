<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#1b1f27;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const W = +q.get('w')||1600, H = +q.get('h')||1000;
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(W,H); renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x1b1f27);
const camera = new THREE.PerspectiveCamera(35, W/H, 0.01, 100);
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x3a3328, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(1.2, 1.6, 0.8); sun.castShadow = true;
sun.shadow.mapSize.set(4096,4096); const sc = sun.shadow.camera; sc.left=-1; sc.right=1; sc.top=1; sc.bottom=-1; sc.near=0.1; sc.far=6; sun.shadow.bias=-0.0005;
scene.add(sun);
const loader = new GLTFLoader();
window.__done = false;
loader.load(q.get('src'), (gltf) => {
  const root = gltf.scene;
  root.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true;
     if (q.get('flat')==='1') { o.material = new THREE.MeshStandardMaterial({color:0xcfcac0, roughness:0.95, metalness:0, flatShading:true}); }
     else if (o.material) { o.material.metalness = 0; o.material.roughness = 1; o.material.side = THREE.DoubleSide; }
  }});
  scene.add(root);
  const box = new THREE.Box3().setFromObject(root); const c = box.getCenter(new THREE.Vector3()); const s = box.getSize(new THREE.Vector3());
  const az = (+q.get('az')||40) * Math.PI/180, el = (+q.get('el')||35) * Math.PI/180, dist = (+q.get('d')||2.2) * Math.max(s.x, s.z);
  camera.position.set(c.x + dist*Math.cos(el)*Math.sin(az), c.y + dist*Math.sin(el), c.z + dist*Math.cos(el)*Math.cos(az));
  camera.lookAt(c.x, c.y, c.z);
  renderer.render(scene, camera);
  window.__done = true;
}, undefined, (e) => { window.__err = String(e); window.__done = true; });
</script></body></html>
